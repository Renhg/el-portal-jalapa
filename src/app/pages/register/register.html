

<section class="register-container">
  <div class="register-card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate en El Portal Jalapa para comenzar.</p>

    <form #registerForm="ngForm" (ngSubmit)="register()">
      <div class="form-group">
        <label for="role">Tipo de cuenta</label>
        <select
          id="role"
          name="role"
          [(ngModel)]="role"
          required
          [disabled]="loading"
        >
          <option value="CLIENTE">Cliente</option>
          <option value="RESTAURANTE">Tienda</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">
          {{ role === 'RESTAURANTE' ? 'Nombre del propietario' : 'Nombre completo' }}
        </label>
        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="name"
          required
          minlength="2"
          maxlength="100"
          autocomplete="name"
          placeholder="Tu nombre"
          [disabled]="loading"
        />
      </div>

      <div class="form-group" *ngIf="role === 'RESTAURANTE'">
        <label for="restaurantName">Nombre de la Tienda</label>
        <input
          id="restaurantName"
          name="restaurantName"
          type="text"
          [(ngModel)]="restaurantName"
          required
          minlength="2"
          maxlength="150"
          placeholder="Nombre de tu Tienda"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          email
          maxlength="150"
          autocomplete="email"
          placeholder="correo@ejemplo.com"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
          placeholder="Repite tu contraseña"
          [disabled]="loading"
        />
      </div>

      <p *ngIf="errorMessage" class="message error" role="alert">
        {{ errorMessage }}
      </p>

      <p *ngIf="successMessage" class="message success" role="status">
        {{ successMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading || registerForm.invalid"
      >
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="login-link">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</section>
